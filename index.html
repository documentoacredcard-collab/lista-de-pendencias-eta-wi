<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Pendências WI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#14213d;--muted:#5d6b8a;--line:#d7ddec;--blue:#14399a;--red:#d8232a;--field:#f6f8fd}
@media (prefers-color-scheme:dark){:root{--bg:#0b1226;--card:#121a33;--ink:#e8ecf8;--muted:#93a0c2;--line:#26335a;--field:#0e1630}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;background:var(--bg);color:var(--ink);font:400 14px 'IBM Plex Sans',system-ui,sans-serif;text-transform:uppercase}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:0 10px 30px rgba(20,57,154,.12);border-top:5px solid var(--blue)}
.logo{display:block;height:46px;margin:0 auto 14px}
h1{margin:0 0 4px;text-align:center;font:700 26px 'Barlow Condensed',sans-serif;letter-spacing:.03em;color:var(--blue)}
@media (prefers-color-scheme:dark){h1{color:#8fb0ff}}
p.sub{margin:0 0 20px;text-align:center;font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.06em}
label{display:block;margin:12px 0 5px;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--muted)}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:500 15px 'IBM Plex Sans',sans-serif}
input#u{text-transform:none}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font:600 14px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:18px;margin-top:12px;text-align:center;color:var(--red);font:500 12px 'IBM Plex Sans',sans-serif}
.foot{font:500 10.5px 'IBM Plex Mono',monospace;color:var(--muted);text-align:center;max-width:420px;line-height:1.5}
</style>
</head>

  var enc=new TextEncoder(), dec=new TextDecoder('utf-8');
  var b64=function(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); };
  var tob64=function(u){ var s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
  var hex=function(buf){ return Array.from(new Uint8Array(buf)).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); };
  var $=function(id){ return document.getElementById(id); };
  var sub=crypto.subtle;
  async function derive(pw,salt){ var km=await sub.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']); return new Uint8Array(await sub.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},km,512)); }
  async function unseal(key,box){
    var ek=await sub.importKey('raw',key.slice(0,32),'AES-CBC',false,['decrypt']);
    var mk=await sub.importKey('raw',key.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
    var iv=b64(box.iv), ct=b64(box.ct), msg=new Uint8Array(iv.length+ct.length); msg.set(iv,0); msg.set(ct,iv.length);
    if(!(await sub.verify('HMAC',mk,b64(box.mac),msg))) throw new Error('mac');

  }

  async function entrar(login,senha){
    var id=hex(await sub.digest('SHA-256',enc.encode('wi|'+login.trim().toLowerCase())));

    if(!u){ await derive(senha,new Uint8Array(16)); throw new Error('user'); }
    var info=JSON.parse(dec.decode(await unseal(await derive(senha,b64(u.salt)),u.box)));

  }
